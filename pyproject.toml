[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hypercompress"
version = "1.0.0"
description = "High-performance parallel compression for multimodal data"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "HyperCompress Contributors" }
]
keywords = [
    "compression",
    "multimodal",
    "parallel",
    "streaming",
    "deduplication",
    "lz4",
    "zstd",
    "brotli"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Archiving :: Compression",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
    "zstandard>=0.21.0",
    "lz4>=4.3.0",
    "brotli>=1.1.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
hypercompress = "hypercompress.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hypercompress*"]
